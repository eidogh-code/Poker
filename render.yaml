# Render Blueprint: Dashboard → New → Blueprint → выбрать репозиторий eidogh-code/Poker.
# Render сам выдаёт HTTPS-адрес вида https://poker-server-xxxx.onrender.com — в игре это wss://poker-server-xxxx.onrender.com
services:
  - type: web
    name: poker-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    # Хранилище рейтинга: бесплатная база Upstash Redis (console.upstash.com → Create database → REST API).
    # Без этих переменных рейтинг пишется в файл, а бесплатный Render стирает диск при каждом засыпании.
    envVars:
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
