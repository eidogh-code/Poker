name: Сборка для Windows и Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # нужно только шагу «Релиз» при пуше тега v*
    steps:
      - uses: actions/checkout@v4

      - name: Тесты движка
        run: node --test tests/cards.test.mjs tests/profile.test.mjs

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Сборка Покер.exe
        shell: pwsh
        run: ./build.ps1

      - name: Латинское имя файла для скачивания
        shell: pwsh
        run: Copy-Item 'dist/Покер.exe' 'dist/Poker-win-x64.exe'

      - uses: actions/upload-artifact@v4
        with:
          name: Poker-win-x64
          path: dist/Poker-win-x64.exe
          if-no-files-found: error

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Poker-win-x64.exe
          generate_release_notes: true

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Тесты сервера сетевой игры
        working-directory: server
        run: |
          npm ci
          npm test

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write # нужно только шагу «Релиз» при пуше тега v*
    env:
      # Секреты репозитория (Settings → Secrets → Actions). Без них APK подписывается отладочным ключом.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Ключ подписи из секретов
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/poker-release.jks"
          printf 'storeFile=poker-release.jks\nstorePassword=%s\nkeyAlias=poker\nkeyPassword=%s\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/poker-release.properties"
          echo "POKER_KEYSTORE_PROPERTIES=$RUNNER_TEMP/poker-release.properties" >> "$GITHUB_ENV"

      - name: Сборка APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/*.apk ../Poker-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Poker-android
          path: Poker-android.apk
          if-no-files-found: error

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Poker-android.apk
